# tv-updater 盒子端配置 —— 部署到 /system/etc/tv-updater.conf
# 机型：UNT401H（九联 / Hi3798MV310，Android 4.4.2）
# 不同机型/客户群可用不同清单：改 MANIFEST_URL 的 group 参数即可分组灰度

# 期望状态清单地址（服务器上的一个 CGI）
MANIFEST_URL=http://your.domain:8083/cgi-bin/manifest

# 轮询间隔（秒）。600=每10分钟自查一次
INTERVAL=600

# 设备分组标识（心跳上报用；服务器据此分发不同方案）
GROUP=prod

# pm install 失败时是否"先卸载再重装"
# 1 = 换签名包/降级时自动重装成功（会丢该应用本地数据）
# 0 = 只记录失败日志，等人工处理
REINSTALL_ON_FAIL=1

# 心跳上报地址（可选，留空关闭）
HEARTBEAT_URL=

# 开机是否自动开网络 adb（端口 30016）
# 1 = 自动开：刷完免人工按遥控器 F3/F4，运维可直接连（局域网内是 root shell，注意网络环境）
# 0 = 不开：需要人工在盒子上开调试
ADB_AUTO=1

# ===== 以下是 tv-maint 日常维护参数（/system/bin/tv-maint 读取本文件）=====

# 固定公共 DNS（防运营商劫持导致直播源/接口失效）
DNS1=223.5.5.5          # 阿里公共 DNS
DNS2=119.29.29.29       # 腾讯公共 DNS
DNS_FORCE=1             # 1=额外用 iptables 把 UDP/TCP 53 强制指向 DNS1

# Wi-Fi 永不休眠
WIFI_KEEP=1

# 可用内存低于此值(MB)时做内存回收
MEM_LOW_MB=150

# 空闲时段自动重启：时间窗（小时，起含止不含）+ 至少已运行小时数
IDLE_HOUR_FROM=3
IDLE_HOUR_TO=5
IDLE_MIN_UP_H=20

# 视为「空闲」的前台应用（桌面/屏保类）；不在列表且屏幕亮着 = 有人在看，不重启
IDLE_PKGS="com.dangbei.tvlauncher com.android.launcher com.android.launcher3 com.example.launcher com.hisilicon.launcher com.unionman.settings"
